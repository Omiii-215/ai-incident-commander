# Local backing services (DEPLOYMENT.md §2). Single-node replica set: transactions
# work, but there is no high availability. App processes run with `pnpm dev`.
services:
  mongo:
    image: mongo:8.2
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27018"]
    ports: ["127.0.0.1:27018:27018"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      # Initiates the replica set on first start; healthy only once a primary exists.
      test: ["CMD", "mongosh", "--port", "27018", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27018'}]}).ok }"]
      interval: 5s
      retries: 30
  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
volumes:
  mongo-data:
  redis-data:
